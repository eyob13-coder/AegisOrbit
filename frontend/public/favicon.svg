<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Threat / Maneuver Crimson Glow -->
    <linearGradient id="threatGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Tactical Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 2. Central Earth Globe Representation -->
  <circle cx="32" cy="32" r="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)" />
  <circle cx="32" cy="32" r="13" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7" />

  <!-- 3. Primary Evasive Orbit Ellipse (Cyan) -->
  <ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(-30 32 32)" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" />

  <!-- 4. Threat / Intercept Debris Trajectory (Crimson) -->
  <path d="M 12 48 Q 32 20 54 18" stroke="url(#threatGrad)" stroke-width="1.8" stroke-dasharray="3 2" stroke-linecap="round" opacity="0.9" />

  <!-- 5. Active Satellite Node at TCA (Cyan diamond beacon) -->
  <g transform="translate(45, 23)">
    <circle cx="0" cy="0" r="3" fill="#22d3ee" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" stroke="#38bdf8" stroke-width="0.75" opacity="0.8" />
  </g>

  <!-- 6. Debris Object Marker (Red Node) -->
  <circle cx="35" cy="27" r="2" fill="#f43f5e" filter="url(#glow)" />

  <!-- 7. Aegis Tactical Crosshair Center -->
  <line x1="32" y1="29" x2="32" y2="35" stroke="#bae6fd" stroke-width="1" opacity="0.8" />
  <line x1="29" y1="32" x2="35" y2="32" stroke="#bae6fd" stroke-width="1" opacity="0.8" />
</svg>
